name: Deploy Main Branch to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Generates AkaiMPCChordProgressionGenerator/pack/*.zip at deploy time -
      # the pack is never committed (see docs/mpc-export-specification.md D7).
      # The script itself exits non-zero on a naming-invariant failure, which
      # fails this job before anything broken is published.
      - name: Build the chord-progression pack
        working-directory: AkaiMPCChordProgressionGenerator
        run: node tools/build-pack.mjs

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          keep_files: true
          # keep_files copies the whole working tree - including .gitignore -
          # onto the gh-pages checkout before this action's own `git add --all`
          # runs there. Left in place, .gitignore's pack/ exclusion (meant only
          # to keep the CI-built pack out of the *source* branch) silently kept
          # it out of every gh-pages publish commit too: the build step logged
          # success and the ZIPs existed on disk, but "git commit" never staged
          # them, so the site kept 404ing on pack/*.zip after every deploy.
          exclude_assets: .github,.gitignore
