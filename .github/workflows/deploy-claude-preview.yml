name: Deploy Claude Preview to GitHub Pages

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # So a preview branch's bulk-export links actually work when reviewed -
      # see docs/mpc-export-specification.md D7.
      - name: Build the chord-progression pack
        working-directory: AkaiMPCChordProgressionGenerator
        run: node tools/build-pack.mjs

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          destination_dir: preview-working
          keep_files: true
          # See the same line in deploy-main-production.yml: without this,
          # .gitignore rides along onto the gh-pages checkout and its pack/
          # exclusion silently drops the built ZIPs from the publish commit.
          exclude_assets: .github,.gitignore
